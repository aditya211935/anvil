# Supplemental Anvil manifest (spec §4). Like Jira, Confluence Cloud's REST API
# v2 has no client-supplied idempotency-key mechanism for any of these creates,
# so they stay honestly non-idempotent rather than fabricating a strategy the
# API doesn't support — mcp-atlassian's confluence_create_page/create_*_comment
# tools carry no dry-run or dedupe parameter either.
service:
  name: confluence
  display_name: Confluence Cloud REST API v2
  owner: backtesting
  environment: prod

# Confluence Cloud accepts basic auth (account email + API token) OR OAuth 2.0
# (3LO authorization code) on every operation. The compiler does not pick
# between alternatives that carry different authority, and the legacy
# scope-only `oauth2` names no grant, so it cannot make the choice: every
# operation would stay blocked. Basic auth is the service credential an
# agent holds; the scopes below are the OAuth scopes the same calls need,
# kept so a simulated principal is gated by them.
auth:
  type: basic
  scopes:
    - read:page:confluence
    - write:page:confluence
    - read:space:confluence
    - write:space:confluence
    - read:comment:confluence
    - write:comment:confluence

operations:
  # Not idempotent: a retried create after a timeout risks a duplicate page
  # (Confluence only rejects an exact-duplicate *title in the same space* as a
  # side effect of the retry, it does not deduplicate the request itself).
  createPage:
    side_effect: mutation
    risk: medium
    idempotency:
      strategy: none
    confirmation:
      required: true
      risk: medium
      reason: Creates a new Confluence page; retrying after a failure may create a duplicate.
    retries:
      enabled: false
    params:
      # Confluence v2 types `body` as oneOf[PageBodyWrite, PageNestedBodyWrite].
      # Both alternatives are open objects, so every body matches both and a
      # strict oneOf (the generated MCP server's zod shape) refuses all of them.
      # Narrow to the flat form the service documents, {representation, value},
      # and require both of its fields. Tighten-only: the nested form is dropped,
      # nothing the flat form did not already accept is admitted.
      body: { one_of: PageBodyWrite, required: [representation, value] }
    state: approved

  # Not idempotent: the space key must be unique, so a bare retry after a
  # timeout either duplicates (different key) or errors (same key) — neither
  # is a safe automatic retry.
  createSpace:
    side_effect: mutation
    risk: medium
    idempotency:
      strategy: none
    confirmation:
      required: true
      risk: medium
      reason: Creates a new Confluence space; retrying after a failure is not provably safe.
    retries:
      enabled: false
    state: approved

  # Not idempotent: each call appends a new footer comment.
  createFooterComment:
    side_effect: mutation
    risk: medium
    idempotency:
      strategy: none
    confirmation:
      required: true
      risk: medium
      reason: Adds a comment; retrying after a failure may post it twice.
    retries:
      enabled: false
    params:
      # Same shape as the page body: oneOf[CommentBodyWrite, CommentNestedBodyWrite],
      # both open objects, so a strict oneOf refuses every comment body. Narrow
      # to the flat {representation, value} form the service documents and
      # require both fields; tighten-only.
      body: { one_of: CommentBodyWrite, required: [representation, value] }
    state: approved

  # Not idempotent: each call appends a new inline comment.
  createInlineComment:
    side_effect: mutation
    risk: medium
    idempotency:
      strategy: none
    confirmation:
      required: true
      risk: medium
      reason: Adds an inline comment; retrying after a failure may post it twice.
    retries:
      enabled: false
    params:
      # As for footer comments: narrow the oneOf[CommentBodyWrite,
      # CommentNestedBodyWrite] body to the flat form; tighten-only.
      body: { one_of: CommentBodyWrite, required: [representation, value] }
    state: approved

  # Everything else keeps the compiler's own classification; only exposure is
  # declared here (see manifests/jira.anvil.yaml for why the manifest form is
  # used instead of the `anvil approve` + `anvil build` per-capability path).
  getPages: { state: approved }
  getPageById: { state: approved }
  updatePage:
    params:
      # The update body carries the same oneOf[PageBodyWrite, PageNestedBodyWrite]
      # `body` as createPage; narrow it the same way, tighten-only.
      body: { one_of: PageBodyWrite, required: [representation, value] }
    state: approved
  deletePage: { state: approved }
  getPageAttachments: { state: approved }
  getPageLabels: { state: approved }
  updatePageTitle: { state: approved }
  getPageVersions: { state: approved }
  getSpaces: { state: approved }
  getSpaceById: { state: approved }
  getFooterComments: { state: approved }
  getInlineComments: { state: approved }
  getPageDirectChildren: { state: approved }
  getPageAncestors: { state: approved }
