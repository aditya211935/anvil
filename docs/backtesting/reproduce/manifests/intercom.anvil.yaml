# Supplemental Anvil manifest (spec §4) for the Intercom API backtest.
# Generated against the real compiled AIR: reads and already-'generated'
# mutations are approved as the compiler classified them; non-idempotent
# creates are declared idempotency:none (no client dedupe key exists) and
# confirmation-required. See docs/backtesting/batch2.md.
service:
  name: intercom
  display_name: Intercom API
  owner: backtesting
  environment: prod
auth:
  # Explicitly selected from the published HTTP security scheme; no OAuth grant is inferred.
  type: jwt_bearer
  scopes: []
operations:
  ShowContact: { state: approved }
  UpdateContact: { state: approved }
  SearchContacts: { state: approved }
  ListContacts: { state: approved }
  CreateContact:
    idempotency: { strategy: none }
    confirmation: { required: true, risk: medium, reason: "Non-idempotent create; retrying after a failure may duplicate it." }
    retries: { enabled: false }
    state: approved
  listConversations: { state: approved }
  createConversation:
    idempotency: { strategy: none }
    confirmation: { required: true, risk: medium, reason: "Non-idempotent create; retrying after a failure may duplicate it." }
    retries: { enabled: false }
    state: approved
  retrieveConversation: { state: approved }
  replyConversation:
    idempotency: { strategy: none }
    confirmation: { required: true, risk: medium, reason: "Non-idempotent create; retrying after a failure may duplicate it." }
    retries: { enabled: false }
    params:
      # The reply body is oneOf[contact_reply_conversation_request,
      # admin_reply_conversation_request] at its root. Both arrive as open
      # objects, so every body matches both and a strict oneOf (the generated
      # MCP server's zod shape) refuses all of them. An integration holds an app
      # access token and replies on behalf of an admin, so narrow to the admin
      # form. Tighten-only: the contact form is dropped, nothing new is admitted.
      body: { one_of: admin_reply_conversation_request }
    state: approved
