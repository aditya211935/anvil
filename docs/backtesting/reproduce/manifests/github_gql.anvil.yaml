# GitHub GraphQL — approve two read-only queries so the corpus loopback
# self-test has a surface to drive; mutations stay review_required.
service:
  name: github_gql
operations:
  viewer:
    state: approved
  repository:
    state: approved
  # `Query.search(query: String!)` takes GitHub's search syntax — an unconstrained
  # query language the compiler blocks as a passthrough, and one no `query_policy`
  # dialect guards. Holding it blocked here is the reviewed decision; the field
  # stays unexposed.
  search:
    state: blocked
