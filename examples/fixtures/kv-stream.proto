// A gRPC fixture with one unary method and one bidirectional stream (etcd's
// Range + Watch, in miniature). The unary call records a `json_transcoded`
// wire binding, which Anvil's generated mock can serve as a declared protocol
// facade; the stream records none — a stream is not a request and a response —
// so the runtime refuses it even under the facade, and the hermetic harness
// lanes must skip it with that reason rather than fail on it.
syntax = "proto3";

package acme.kv.v1;

service KV {
  rpc Range(RangeRequest) returns (RangeResponse);
  rpc Watch(stream WatchRequest) returns (stream WatchResponse);
}

message RangeRequest {
  string key = 1;
  int32 limit = 2;
}

message KeyValue {
  string key = 1;
  string value = 2;
}

message RangeResponse {
  repeated KeyValue kvs = 1;
}

message WatchRequest {
  string key = 1;
}

message WatchResponse {
  string event = 1;
}
